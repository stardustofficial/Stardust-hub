        /* ====== COMPLETE STYLES (all previous styles included) ====== */
        * {
            box-sizing: border-box;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
            transition: background-color 0.3s ease, color 0.3s ease;
        }
        /* ... (all CSS from previous version) ... */
        /* ===== LOADING SCREEN FIX ===== */
        #loading-screen {
            position: fixed;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            transition: opacity 0.3s ease;
            background: #f0f2f5;
        }
        body.dark-mode #loading-screen {
            background: #0b1528;
        }
        #loading-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        .loading-spinner {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.1);
            border-top-color: #2563eb;
            animation: spin 0.8s linear infinite;
            margin-bottom: 20px;
        }
        body.dark-mode .loading-spinner {
            border-color: rgba(255, 255, 255, 0.1);
            border-top-color: #06b6d4;
        }
        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }
            100% {
                transform: rotate(360deg);
            }
        }

        /* ===== LANGUAGE SELECTOR ===== */
        .language-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .language-grid button {
            padding: 8px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            background: rgba(255, 255, 255, 0.05);
            color: #e2e8f0;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .language-grid button:hover {
            background: rgba(6, 182, 212, 0.15);
            border-color: rgba(6, 182, 212, 0.3);
        }
        .language-grid button.active {
            background: rgba(6, 182, 212, 0.2);
            border-color: #06b6d4;
            color: #06b6d4;
        }
        body.light-mode .language-grid button {
            color: #1a1a2e;
            background: rgba(0, 0, 0, 0.05);
            border-color: #e4e6eb;
        }
        body.light-mode .language-grid button.active {
            background: rgba(37, 99, 235, 0.1);
            border-color: #2563eb;
            color: #2563eb;
        }

        /* ===== SUBSCRIPTION ===== */
        .subscription-active {
            border: 2px solid #34d399;
            box-shadow: 0 0 30px rgba(52, 211, 153, 0.2);
        }
        .subscription-expired {
            border: 2px solid #ef4444;
            box-shadow: 0 0 30px rgba(239, 68, 68, 0.2);
        }

        /* ===== PRIVACY & TERMS LINKS ===== */
        .policy-link {
            color: #06b6d4;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .policy-link:hover {
            text-decoration: underline;
            opacity: 0.8;
        }

        /* ===== TOAST ===== */
        .success-toast {
            position: fixed;
            bottom: 100px;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            padding: 16px 24px;
            border-radius: 20px;
            z-index: 200;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
            animation: toastIn 0.5s ease-out;
            max-width: 90%;
            text-align: center;
        }
        .success-toast.hidden {
            display: none;
        }
        @keyframes toastIn {
            0% {
                opacity: 0;
                transform: translateX(-50%) translateY(30px) scale(0.9);
            }
            100% {
                opacity: 1;
                transform: translateX(-50%) translateY(0) scale(1);
            }
        }

        /* ===== SCROLLBAR ===== */
        .custom-scrollbar::-webkit-scrollbar {
            width: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            border-radius: 10px;
        }
        body.dark-mode .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #334155;
        }
        body.light-mode .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #c0c0cc;
        }

        /* ===== REEL THREE DOT ===== */
        .reel-three-dot-menu {
            position: absolute;
            bottom: 120px;
            right: 16px;
            z-index: 15;
        }
        .reel-three-dot-menu button {
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: white;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .reel-three-dot-menu button:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .reel-three-dot-dropdown {
            position: absolute;
            bottom: 45px;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 4px 0;
            min-width: 140px;
            display: none;
            z-index: 20;
        }
        .reel-three-dot-dropdown.show {
            display: block;
        }
        .reel-three-dot-dropdown button {
            width: 100%;
            padding: 8px 16px;
            text-align: left;
            color: white;
            font-size: 11px;
            background: transparent;
            border: none;
            border-radius: 0;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .reel-three-dot-dropdown button:hover {
            background: rgba(255, 255, 255, 0.1);
        }
        .reel-three-dot-dropdown .delete-option {
            color: #ff6b6b;
        }
        .reel-three-dot-dropdown .delete-option:hover {
            background: rgba(255, 0, 0, 0.15);
        }
        .reel-three-dot-dropdown .edit-option {
            color: #4fc3f7;
        }
        .reel-three-dot-dropdown .edit-option:hover {
            background: rgba(0, 150, 255, 0.15);
        }

        /* ===== REELS CONTAINER ===== */
        .reels-container {
            height: calc(100vh - 110px);
            scroll-snap-type: y mandatory;
            overflow-y: scroll;
            scroll-behavior: smooth;
        }
        .reels-container::-webkit-scrollbar {
            display: none;
        }
        .reel-item {
            height: calc(100vh - 110px);
            scroll-snap-align: start;
            position: relative;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .reel-item video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .reel-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            padding: 20px;
        }
        .reel-actions {
            position: absolute;
            right: 16px;
            bottom: 100px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            z-index: 10;
        }
        .reel-actions button {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: white;
            gap: 4px;
            font-size: 11px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }
        .reel-actions button svg {
            width: 28px;
            height: 28px;
            filter: drop-shadow(0 2px 8px rgba(0, 0, 0, 0.5));
        }
        .reel-actions button .count {
            font-weight: bold;
            font-size: 12px;
        }
        .reel-user-info {
            cursor: pointer;
            transition: opacity 0.2s;
        }
        .reel-user-info:hover {
            opacity: 0.7;
        }

        function showSuccessToast(title, message, icon = '✅') {
            const toast = document.getElementById('success-toast');
            if (!toast) return;
            document.getElementById('toast-icon').textContent = icon;
            document.getElementById('toast-title').textContent = title;
            document.getElementById('toast-message').textContent = message;
            toast.classList.remove('hidden');
            if (window.toastTimeout) clearTimeout(window.toastTimeout);
            window.toastTimeout = setTimeout(() => toast.classList.add('hidden'), 4000);
        }

        function saveStateToHardware() {
            localStorage.setItem("STARDUST_CORE_DB_PROD", JSON.stringify(databaseState));
        }

        function recoverStateFromHardware() {
            const raw = localStorage.getItem("STARDUST_CORE_DB_PROD");
            if (raw) {
                try {
                    const parsed = JSON.parse(raw);
                    if (parsed.currentUser) databaseState.currentUser = parsed.currentUser;
                    if (parsed.notifications) databaseState.notifications = parsed.notifications;
                    if (parsed.viewedReels) databaseState.viewedReels = parsed.viewedReels;
                    if (parsed.reelViewTracked) databaseState.reelViewTracked = parsed.reelViewTracked;
                    if (parsed.collabData) databaseState.collabData = parsed.collabData;
                    if (parsed.tagData) databaseState.tagData = parsed.tagData;
                } catch (e) {}
            }
        }

        function toggleElement(id) { const el = document.getElementById(id); if (el) el.classList.toggle('hidden'); }

        function closeElement(id) { const el = document.getElementById(id); if (el) el.classList.add('hidden'); }

        function copyToClipboard(text) {
            navigator.clipboard.writeText(text).then(() => {
                showSuccessToast('Copied!', 'Link copied to clipboard.', '📋');
            }).catch(() => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                showSuccessToast('Copied!', 'Link copied to clipboard.', '📋');
            });
        }

        function generatePostLink(postId) {
            return window.location.origin + window.location.pathname + '?post=' + postId;

        function isUserBlocked(userId) {
            const currentUser = databaseState.currentUser;
            if (!currentUser) return false;
            return currentUser.blocked && currentUser.blocked[userId] === true;
        }

        function formatTime(timestamp) {
            const date = new Date(timestamp);
            const now = new Date();
            const diff = now - date;
            if (diff < 60000) return 'Just now';
            if (diff < 3600000) return Math.floor(diff / 60000) + 'm';
            if (diff < 86400000) return Math.floor(diff / 3600000) + 'h';
            if (diff < 604800000) return Math.floor(diff / 86400000) + 'd';
            return date.toLocaleDateString();
        }

        function applyTheme(theme) {
            const body = document.body;
            const checkbox = document.getElementById('theme-toggle-checkbox');
            const dot = document.getElementById('theme-toggle-dot');
            body.classList.remove('light-mode', 'dark-mode');
            body.classList.add(theme + '-mode');
            if (theme === 'dark') {
                if (checkbox) checkbox.checked = true;
                if (dot) dot.style.transform = 'translateX(18px)';
            } else {
                if (checkbox) checkbox.checked = false;
                if (dot) dot.style.transform = 'translateX(1px)';
            }
            localStorage.setItem('stardust_theme', theme);
        }

        window.toggleTheme = function() {
            const current = getStoredTheme();
            const newTheme = current === 'light' ? 'dark' : 'light';
            applyTheme(newTheme);

        function applyLanguage() {
            const lang = translations[currentLanguage] || translations.en;
            document.querySelectorAll('[data-lang]').forEach(el => {
                const key = el.dataset.lang;
                if (lang[key]) {
                    el.textContent = lang[key];
                }
            });
            // Update placeholders
            document.querySelectorAll('[data-lang-placeholder]').forEach(el => {
                const key = el.dataset.langPlaceholder;
                if (lang[key]) {
                    el.placeholder = lang[key];
                }
            });

        window.handleCustomSystemLogin = function() {
            const identifier = document.getElementById('login-identifier').value.trim();
            const password = document.getElementById('login-password').value.trim();
            const phone = document.getElementById('login-phone').value.trim();

            if (phone) {
                window.phoneLogin(phone);
                return;
            }

            if (!identifier || !password) {
                showSuccessToast('Error', 'Please enter all credentials.', '❌');
                return;
            }

            document.getElementById('btn-text-login').classList.add('hidden');
            document.getElementById('btn-spinner-login').classList.remove('hidden');

            if (identifier.includes('@')) {
                executeFirebaseSignIn(identifier, password);
            } else {
                onValue(ref(db, 'users'), (snapshot) => {
                    const data = snapshot.val();
                    let targetEmail = null;
                    if (data) {
                        const targetUserNode = Object.values(data).find(p => p.username === identifier);
                        if (targetUserNode && targetUserNode.email) {
                            targetEmail = targetUserNode.email;
                        }
                    }
                    if (targetEmail) {
                        executeFirebaseSignIn(targetEmail, password);
                    } else {
                        showSuccessToast('Error', 'Username not found.', '❌');
                        document.getElementById('btn-text-login').classList.remove('hidden');
                        document.getElementById('btn-spinner-login').classList.add('hidden');
                    }
                }, { onlyOnce: true });
            }
        };

        function executeFirebaseSignIn(email, password) {

                        if (data) {
                            const mappedNode = Object.values(data).find(p => p.realFirebaseUID === userCredential.user
                                .uid);
                            if (mappedNode) {

                                if (!databaseState.currentUser.savedPosts) databaseState.currentUser.savedPosts = [];
                                if (!databaseState.currentUser.savedReels) databaseState.currentUser.savedReels = [];

        window.processPublicationInit = function() {
            const txt = document.getElementById('post-input-text').value.trim();
            const imgFile = document.getElementById('post-input-gallery-file').files[0];
            const hashtags = document.getElementById('post-input-hashtags').value.trim();
            const privacy = document.getElementById('post-privacy').value;
            const commentsSetting = document.getElementById('post-comments-setting').value;
            const collabList = databaseState.collabData.post || [];
            const tagList = databaseState.tagData.post || [];

            if (!txt && !imgFile) {
                showSuccessToast('Info', 'Please add some text or an image.', '📝');
                return;
            }

            showUploadLoading();
            closeModal('post-modal');

            const hashtagArray = hashtags ? hashtags.split(',').map(h => h.trim().replace('#', '').toLowerCase()).filter(h =>
                h) : [];

            const commitPost = (base64Img) => {
                const postNode = {
                    id: 'post_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                    authorUID: databaseState.currentUser.uid,
                    authorName: databaseState.currentUser.name,
                    authorAvatar: databaseState.currentUser.pfp,
                    text: txt,
                    image: base64Img || null,
                    hashtags: hashtagArray,
                    privacy: privacy,
                    commentsEnabled: commentsSetting === 'on',
                    collaborators: collabList,
                    tags: tagList,
                    timestamp: Date.now(),
                    likes: {},
                    comments: {}
                };

                push(ref(db, 'publications'), postNode).then(() => {
                    databaseState.collabData.post = [];
                    databaseState.tagData.post = [];
                    document.getElementById('post-collab-tags').innerHTML = '';
                    document.getElementById('post-tag-list').innerHTML = '';
                    document.getElementById('post-input-text').value = '';
                    document.getElementById('post-input-gallery-file').value = '';
                    document.getElementById('post-input-hashtags').value = '';
                    hideUploadLoading();
                    showSuccessToast('Post Published!', 'Your post has been published successfully.', '📝');
                    loadInitialPosts();
                }).catch((err) => {
                    console.error('Error publishing post:', err);
                    hideUploadLoading();
                    showSuccessToast('Error', 'Failed to publish post.', '❌');
                });
            };

            if (imgFile) {
                const reader = new FileReader();
                reader.onload = (e) => commitPost(e.target.result);
                reader.onerror = () => { hideUploadLoading();
                    showSuccessToast('Error', 'Failed to read image.', '❌'); };
                reader.readAsDataURL(imgFile);
            } else {
                commitPost(null);
            }
        };

        function loadInitialPosts() {
            const postsRef = ref(db, 'publications');
            onValue(postsRef, (snap) => {
                const data = snap.val();
                let loadedPosts = [];
                if (data) {
                    Object.keys(data).forEach(k => {
                        const post = data[k];
                        if (post && post.id && (post.text || post.image)) {
                            loadedPosts.push(post);
                        }
                    });
                }
                databaseState.publications = loadedPosts.sort((a, b) => b.timestamp - a.timestamp);
                renderEcosystemFeed();
            });
        }

        function renderEcosystemFeed() {

                    if (post.authorUID === myUID) return true;
                    const author = databaseState.peers.find(p => p.uid === post.authorUID);
                    if (author && author.followers && author.followers[myUID]) return true;
                    return false;

                if (isUserBlocked(post.authorUID)) return false;
                return true;

        window.deletePost = function(postId) {
            const myUID = databaseState.currentUser.uid;
            const targetPost = databaseState.publications.find(p => p.id === postId);
            if (!targetPost) { showSuccessToast('Error', 'Post not found.', '❌'); return; }
            if (targetPost.authorUID !== myUID) { showSuccessToast('Error', 'You can only delete your own posts.', '❌');
                return; }
            if (confirm(`Are you sure you want to delete this post?`)) {
                const pubRef = ref(db, 'publications');
                get(pubRef).then((snap) => {
                    const data = snap.val();
                    if (data) {
                        let dbKey = null;
                        Object.keys(data).forEach(k => { if (data[k] && data[k].id === postId) { dbKey = k; } });
                        if (dbKey) {
                            remove(ref(db, `publications/${dbKey}`)).then(() => {
                                showSuccessToast('Deleted!', 'Post deleted successfully.', '🗑️');
                                loadInitialPosts();
                            }).catch((err) => { showSuccessToast('Error', 'Failed to delete post.', '❌'); });
                        }
                    }
                });
            }
        };

        window.handlePublicationLikeToggle = function(postId) {
            const pubRef = ref(db, 'publications');
            get(pubRef).then((snap) => {
                const data = snap.val();
                if (data) {
                    let dbKey = null;
                    const keys = Object.keys(data);
                    for (let k of keys) {
                        if (data[k] && data[k].id === postId) { dbKey = k; break; }
                    }
                    if (dbKey) {
                        const myUID = databaseState.currentUser.uid;
                        const likeRef = ref(db, `publications/${dbKey}/likes/${myUID}`);
                        const currentLikes = data[dbKey].likes || {};
                        const wasLiked = currentLikes[myUID];
                        if (wasLiked) {
                            remove(likeRef);
                        } else {
                            set(likeRef, true);
                            const postOwner = data[dbKey].authorUID;
                            if (postOwner && postOwner !== myUID) {
                                addNotification({
                                    type: 'like',
                                    message: `${databaseState.currentUser.name} liked your post ❤️`,
                                    targetUserId: postOwner,
                                    sourceUserId: myUID,
                                    postId: postId
                                });
                            }
                        }
                    }
                }
            });
        };

        window.savePost = function(postId) {
            const targetPost = databaseState.publications.find(p => p.id === postId);
            if (!targetPost) return;
            const myUID = databaseState.currentUser.uid;
            const userRef = ref(db, 'users/' + myUID);
            get(userRef).then((snap) => {
                const userData = snap.val();
                let saved = userData.savedPosts || [];
                if (saved.includes(postId)) {
                    saved = saved.filter(id => id !== postId);
                    showSuccessToast('Removed', 'Post removed from saved list.', '📁');
                } else {
                    saved.push(postId);
                    showSuccessToast('Saved!', 'Post saved to your collection.', '💾');
                }
                update(userRef, { savedPosts: saved }).then(() => {
                    databaseState.currentUser.savedPosts = saved;
                    saveStateToHardware();
                    renderEcosystemFeed();
                });
            });
        };

        window.openImageViewer = function(imageSrc) {
            if (!imageSrc) return;
            document.getElementById('viewer-target-image').src = imageSrc;
            document.getElementById('full-screen-image-viewer').classList.remove('hidden');
        };

        window.openPublicationInspectionModal = function(postId) {
            const targetPost = databaseState.publications.find(p => p.id === postId);
            if (!targetPost) return;
            const isPostOwner = targetPost.authorUID === databaseState.currentUser.uid;

            const modalPayload = document.getElementById('expanded-post-payload');
            modalPayload.innerHTML = `
                    <div class="space-y-2">
                        <p class="font-bold text-slate-400">Context Body</p>
                        <p class="text-slate-800 dark:text-slate-200 bg-lightbg dark:bg-darkbg p-3 rounded-xl border border-lightborder dark:border-slate-800">${targetPost.text}</p>
                    </div>
                    ${targetPost.image ? `<div class="rounded-xl overflow-hidden border border-slate-300 dark:border-slate-700 cursor-pointer" onclick="openImageViewer('${targetPost.image}')"><img src="${targetPost.image}" class="w-full max-h-40 object-cover"></div>` : ''}
                    <div class="space-y-2">
                        <p class="font-bold text-slate-400">Comments Stack</p>
                        <div id="expanded-post-comments-grid" class="space-y-2 max-h-48 overflow-y-auto custom-scrollbar"></div>
                    </div>
                    ${targetPost.commentsEnabled !== false ? `
                        <div class="flex gap-2 mt-2">
                            <input type="text" id="post-comment-input-field" placeholder="Append transaction comment..." class="flex-1 bg-lightbg dark:bg-darkbg border border-lightborder dark:border-slate-800 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-slate-400 dark:focus:border-slate-700 text-slate-800 dark:text-slate-200">
                            <button onclick="dispatchPublicationComment('${postId}')" class="bg-cyan-600 hover:bg-cyan-700 text-white font-bold px-4 py-2 rounded-xl">Append</button>
                        </div>
                    ` : `<p class="text-xs text-slate-500 italic">Comments are disabled for this post.</p>`}
                `;

            const commentGrid = document.getElementById('expanded-post-comments-grid');
            if (targetPost.comments && Object.keys(targetPost.comments).length > 0) {
                Object.keys(targetPost.comments).forEach(commentKey => {
                    const c = targetPost.comments[commentKey];
                    const isCommentOwner = c.authorUID === databaseState.currentUser.uid;
                    const canDelete = isPostOwner || isCommentOwner;

                    const el = document.createElement('div');
                    el.className =
                        "bg-slate-100 dark:bg-slate-900 border border-slate-300 dark:border-slate-800 p-2.5 rounded-xl space-y-0.5 flex justify-between items-start";
                    el.innerHTML = `
                            <div>
                                <p class="font-bold text-slate-600 dark:text-slate-400 text-xs">@${c.authorName}:</p>
                                <p class="text-slate-700 dark:text-slate-300 text-xs">${c.text}</p>
                            </div>
                            ${canDelete ? `
                                <button onclick="deleteComment('${postId}', '${commentKey}')" 
                                    class="comment-delete-btn text-red-400 hover:text-red-300 p-1 rounded-lg text-xs">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                                </button>
                            ` : ''}
                        `;
                    commentGrid.appendChild(el);
                });
            } else {
                commentGrid.innerHTML =
                    `<p class="text-[10px] text-slate-600 italic text-center py-2">No active comments linked inside framework.</p>`;
            }
            openModal('expanded-post-modal');
        };

        window.dispatchPublicationComment = function(postId) {
            const field = document.getElementById('post-comment-input-field');
            const txt = field.value.trim();
            if (!txt) return;

            onValue(ref(db, 'publications'), (snap) => {
                const data = snap.val();
                if (data) {
                    const dbKey = Object.keys(data).find(k => data[k] && data[k].id === postId);
                    if (dbKey) {
                        const myUID = databaseState.currentUser.uid;
                        const postOwner = data[dbKey].authorUID;
                        const payload = {
                            authorUID: myUID,
                            authorName: databaseState.currentUser.name,
                            text: txt,
                            timestamp: Date.now()
                        };
                        push(ref(db, `publications/${dbKey}/comments`), payload).then(() => {
                            field.value = '';
                            closeModal('expanded-post-modal');
                            showSuccessToast('Commented!', 'Your comment has been posted.', '💬');
                            if (postOwner !== myUID) {
                                addNotification({
                                    type: 'comment',
                                    message: `${databaseState.currentUser.name} commented on your post: "${txt}"`,
                                    targetUserId: postOwner,
                                    sourceUserId: myUID,
                                    postId: postId
                                });
                            }
                            loadInitialPosts();
                        });
                    }
                }
            }, { onlyOnce: true });
        };

        window.deleteComment = function(postId, commentKey) {
            const myUID = databaseState.currentUser.uid;
            const targetPost = databaseState.publications.find(p => p.id === postId);
            if (!targetPost) { showSuccessToast('Error', 'Post not found.', '❌'); return; }
            const comment = targetPost.comments ? targetPost.comments[commentKey] : null;
            if (!comment) { showSuccessToast('Error', 'Comment not found.', '❌'); return; }
            const isPostOwner = targetPost.authorUID === myUID;
            const isCommentAuthor = comment.authorUID === myUID;
            if (!isPostOwner && !isCommentAuthor) {
                showSuccessToast('Error', 'You can only delete your own comments.', '❌');
                return;
            }
            if (confirm('Are you sure you want to delete this comment?')) {
                const pubRef = ref(db, 'publications');
                get(pubRef).then((snap) => {
                    const data = snap.val();
                    if (data) {
                        let dbKey = null;
                        Object.keys(data).forEach(k => { if (data[k] && data[k].id === postId) { dbKey = k; } });
                        if (dbKey) {
                            remove(ref(db, `publications/${dbKey}/comments/${commentKey}`)).then(() => {
                                showSuccessToast('Deleted!', 'Comment deleted successfully.', '🗑️');
                                loadInitialPosts();
                            }).catch((err) => { showSuccessToast('Error', 'Failed to delete comment.', '❌'); });
                        }
                    }
                });
            }
        };

        function loadReelsOnDemand() {
            if (isReelsLoaded) return;
            isReelsLoaded = true;

            const reelRef = ref(db, 'reels');
            onValue(reelRef, (snap) => {
                const data = snap.val();
                let loadedReels = [];
                if (data) {
                    Object.keys(data).forEach(k => {
                        if (data[k] && data[k].id) {
                            loadedReels.push(data[k]);
                        }
                    });
                }
                databaseState.reels = loadedReels.sort((a, b) => b.createdAt - a.createdAt);
                renderReelsFeed();
                renderProfileReels();
            });
        }

        function setupReelAutoPlay() {
            const container = document.getElementById('reels-feed');
            const videos = container.querySelectorAll('.reel-item video');

            if (reelObserver) {
                reelObserver.disconnect();
                reelObserver = null;
            }

            Object.keys(reelViewTimers).forEach(key => {
                clearTimeout(reelViewTimers[key]);
                delete reelViewTimers[key];
            });

            reelObserver = new IntersectionObserver((entries) => {
                entries.forEach(entry => {
                    const video = entry.target;
                    const reelItem = video.closest('.reel-item');
                    const reelId = reelItem ? reelItem.dataset.reelId : null;

                    if (entry.isIntersecting) {
                        video.play().catch(() => {});
                        if (reelId && !databaseState.reelViewTracked[reelId] && !reelViewTimers[reelId]) {
                            reelViewTimers[reelId] = setTimeout(() => {
                                trackReelView(reelId);
                                delete reelViewTimers[reelId];
                            }, 3000);
                        }
                    } else {
                        video.pause();
                        if (reelId && reelViewTimers[reelId]) {
                            clearTimeout(reelViewTimers[reelId]);
                            delete reelViewTimers[reelId];
                        }
                    }
                });
            }, { threshold: 0.6 });

            videos.forEach(video => reelObserver.observe(video));
        }

        function trackReelView(reelId) {
            if (databaseState.reelViewTracked[reelId]) return;

            const myUID = databaseState.currentUser.uid;
            const reelRef = ref(db, 'reels');
            get(reelRef).then((snap) => {
                const data = snap.val();
                if (!data) return;
                let dbKey = null;
                const keys = Object.keys(data);
                for (let k of keys) {
                    if (data[k] && data[k].id === reelId) { dbKey = k; break; }
                }
                if (!dbKey) return;

                const viewedUsers = data[dbKey].viewedUsers || {};
                if (viewedUsers[myUID]) {
                    databaseState.reelViewTracked[reelId] = true;
                    saveStateToHardware();
                    return;
                }

                const viewsRef = ref(db, `reels/${dbKey}`);
                runTransaction(viewsRef, (current) => {
                    if (current === null) return current;
                    if (!current.viewedUsers) current.viewedUsers = {};
                    if (current.viewedUsers[myUID]) return current;
                    current.viewedUsers[myUID] = true;
                    current.views = (current.views || 0) + 1;
                    return current;
                }).then((result) => {
                    if (result.committed) {
                        databaseState.reelViewTracked[reelId] = true;
                        saveStateToHardware();
                        const countEl = document.getElementById(`reel-views-count-${reelId}`);
                        if (countEl) {
                            const currentCount = parseInt(countEl.textContent) || 0;
                            countEl.textContent = currentCount + 1;
                        }
                    }
                }).catch(err => console.warn('View tracking failed:', err));
            });
        }

        window.handleReelUpload = async function() {
            const fileInput = document.getElementById('reel-input-file');
            const caption = document.getElementById('reel-input-caption').value.trim();
            const hashtags = document.getElementById('reel-input-hashtags').value.trim();
            const privacy = document.getElementById('reel-privacy').value;
            const commentsSetting = document.getElementById('reel-comments-setting').value;
            const collabList = databaseState.collabData.reel || [];
            const tagList = databaseState.tagData.reel || [];

            const file = fileInput.files[0];
            if (!file) { showSuccessToast('Info', 'Please select a video to upload.', '📹'); return; }
            if (!file.type.startsWith('video/')) { showSuccessToast('Error', 'Please select a video file.', '❌');
                return; }

            showUploadLoading();
            closeModal('post-modal');

            const hashtagArray = hashtags ? hashtags.split(',').map(h => h.trim().replace('#', '').toLowerCase()).filter(h =>
                h) : [];

            const formData = new FormData();
            formData.append('file', file);
            formData.append('upload_preset', CLOUDINARY.uploadPreset);
            formData.append('resource_type', 'video');

            try {
                const response = await fetch(`https://api.cloudinary.com/v1_1/${CLOUDINARY.cloudName}/video/upload`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();
                if (data.error) {
                    console.log('Cloudinary Error:', data.error);
                    hideUploadLoading();
                    showSuccessToast('Error', 'Upload failed: ' + data.error.message, '❌');
                    return;
                }

                if (data.secure_url) {
                    const reelData = {
                        id: 'reel_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                        userId: databaseState.currentUser.uid,
                        userName: databaseState.currentUser.name,
                        userAvatar: databaseState.currentUser.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150',
                        videoUrl: data.secure_url,
                        thumbnail: data.thumbnail_url || data.secure_url,
                        caption: caption || '',
                        hashtags: hashtagArray,
                        privacy: privacy,
                        commentsEnabled: commentsSetting === 'on',
                        collaborators: collabList,
                        tags: tagList,
                        likes: {},
                        comments: {},
                        savedBy: [],
                        views: 0,
                        viewedUsers: {},
                        createdAt: Date.now()
                    };

                    push(ref(db, 'reels'), reelData).then(() => {
                        databaseState.collabData.reel = [];
                        databaseState.tagData.reel = [];
                        document.getElementById('reel-collab-tags').innerHTML = '';
                        document.getElementById('reel-tag-list').innerHTML = '';
                        hideUploadLoading();
                        document.getElementById('reel-input-file').value = '';
                        document.getElementById('reel-input-caption').value = '';
                        document.getElementById('reel-input-hashtags').value = '';
                        showSuccessToast('Reel Uploaded!', 'Your reel has been published successfully.', '🎬');
                        isReelsLoaded = false;
                        loadReelsOnDemand();
                    }).catch((err) => {
                        console.error('Reel push error:', err);
                        hideUploadLoading();
                        showSuccessToast('Error', 'Failed to save reel.', '❌');
                    });
                } else {
                    hideUploadLoading();
                    showSuccessToast('Error', 'Upload failed. Please try again.', '❌');
                }
            } catch (error) {
                console.error('Upload error:', error);
                hideUploadLoading();
                showSuccessToast('Error', 'Failed to upload reel: ' + error.message, '❌');
            }
        };

            const currentTags = databaseState.tagData[type] || [];

            if (currentTags.includes(uid)) {
                databaseState.tagData[type] = currentTags.filter(id => id !== uid);
                btn.textContent = 'Tag';
                btn.className = 'select-btn select';
                btn.closest('.collab-grid-item').classList.remove('selected');
            } else {
                databaseState.tagData[type] = [...currentTags, uid];
                btn.textContent = 'Tagged';
                btn.className = 'select-btn selected';
                btn.closest('.collab-grid-item').classList.add('selected');
            }
        };

        window.confirmTags = function() {
            const type = databaseState.currentPostType || 'post';
            const tagContainer = document.getElementById(type + '-tag-list');
            tagContainer.innerHTML = '';
            const tags = databaseState.tagData[type] || [];

            if (tags.length > 0) {
                tags.forEach(uid => {
                    const peer = databaseState.peers.find(p => p.uid === uid);
                    if (peer) {
                        const badge = document.createElement('span');
                        badge.className =
                            'text-[10px] text-cyan-400 font-bold bg-cyan-500/10 px-2 py-0.5 rounded-full border border-cyan-500/20 cursor-pointer hover:bg-cyan-500/20';
                        badge.textContent = '@' + (peer.username || peer.uid);
                        badge.onclick = () => goToUserProfile(peer.uid);
                        tagContainer.appendChild(badge);
                    }
                });
            }
            closeModal('tag-modal');
            showSuccessToast('Tags Confirmed!', `${tags.length} people tagged.`, '🏷️');
        };

        // ============================================================
        // SOCIAL FUNCTIONS
        // ============================================================
        window.followUser = function(targetUID) {
            const myUID = databaseState.currentUser.uid;
            if (myUID === targetUID) { showSuccessToast('Info', 'You cannot follow yourself.', 'ℹ️'); return; }
            if (databaseState.currentUser.following && databaseState.currentUser.following[targetUID]) {
                showSuccessToast('Info', 'Already following this user.', 'ℹ️');
                return;
            }
            if (isUserBlocked(targetUID)) {
                showSuccessToast('Error', 'You have blocked this user.', '❌');
                return;
            }

            const updates = {};
            updates[`users/${myUID}/following/${targetUID}`] = true;
            updates[`users/${targetUID}/followers/${myUID}`] = true;

            update(ref(db), updates).then(() => {
                databaseState.currentUser.following[targetUID] = true;
                const targetUser = databaseState.peers.find(p => p.uid === targetUID);
                if (targetUser) {
                    targetUser.followers = targetUser.followers || {};
                    targetUser.followers[myUID] = true;
                }
                saveStateToHardware();
                showSuccessToast('Followed!', 'You are now following this user.', '➕');
                addNotification({
                    type: 'follow',
                    message: `${databaseState.currentUser.name} started following you!`,
                    targetUserId: targetUID,
                    sourceUserId: myUID
                });
                renderProfile();
                renderChatList();
            }).catch((error) => { showSuccessToast('Error', error.message, '❌'); });
        };

        window.unfollowUser = function(targetUID) {
            const myUID = databaseState.currentUser.uid;
            const updates = {};
            updates[`users/${myUID}/following/${targetUID}`] = null;
            updates[`users/${targetUID}/followers/${myUID}`] = null;

            update(ref(db), updates).then(() => {
                if (databaseState.currentUser.following) {
                    delete databaseState.currentUser.following[targetUID];
                }
                const targetUser = databaseState.peers.find(p => p.uid === targetUID);
                if (targetUser && targetUser.followers) {
                    delete targetUser.followers[myUID];
                }
                saveStateToHardware();
                showSuccessToast('Unfollowed', 'You unfollowed this user.', '➖');
                renderProfile();
                renderChatList();
            }).catch((error) => { showSuccessToast('Error', error.message, '❌'); });
        };

        window.blockUser = function(targetUID) {
            const myUID = databaseState.currentUser.uid;
            if (myUID === targetUID) { showSuccessToast('Info', 'You cannot block yourself.', 'ℹ️'); return; }
            if (databaseState.currentUser.blocked && databaseState.currentUser.blocked[targetUID]) {
                showSuccessToast('Info', 'User already blocked.', 'ℹ️');
                return;
            }

            const updates = {};
            updates[`users/${myUID}/blocked/${targetUID}`] = true;
            if (databaseState.currentUser.following && databaseState.currentUser.following[targetUID]) {
                updates[`users/${myUID}/following/${targetUID}`] = null;
                updates[`users/${targetUID}/followers/${myUID}`] = null;
            }
            if (databaseState.currentUser.followers && databaseState.currentUser.followers[targetUID]) {
                updates[`users/${targetUID}/following/${myUID}`] = null;
                updates[`users/${myUID}/followers/${targetUID}`] = null;
            }

            update(ref(db), updates).then(() => {
                databaseState.currentUser.blocked[targetUID] = true;
                if (databaseState.currentUser.following) delete databaseState.currentUser.following[targetUID];
                if (databaseState.currentUser.followers) delete databaseState.currentUser.followers[targetUID];
                saveStateToHardware();
                showSuccessToast('Blocked', 'User has been blocked.', '🚫');
                closeModal('full-screen-account-modal');
                renderProfile();
                renderChatList();
            }).catch((error) => { showSuccessToast('Error', error.message, '❌'); });
        };

        window.unblockUser = function(targetUID) {
            const myUID = databaseState.currentUser.uid;
            const updates = {};
            updates[`users/${myUID}/blocked/${targetUID}`] = null;

            update(ref(db), updates).then(() => {
                if (databaseState.currentUser.blocked) {
                    delete databaseState.currentUser.blocked[targetUID];
                }
                saveStateToHardware();
                showSuccessToast('Unblocked', 'User has been unblocked.', '✅');
                renderBlockedUsers();
            }).catch((error) => { showSuccessToast('Error', error.message, '❌'); });
        };

        // ============================================================
        // CHAT FUNCTIONS
        // ============================================================
        function renderChatList() {
            const container = document.getElementById('active-chats-list');
            const requestsContainer = document.getElementById('incoming-requests-list');
            container.innerHTML = '';
            requestsContainer.innerHTML = '';

            const myUID = databaseState.currentUser.uid;

            let pendingCount = 0;
            databaseState.peers.forEach(peer => {
                if (peer.uid === myUID) return;
                if (peer.followers && peer.followers[myUID] && !databaseState.currentUser.following?.[peer.uid]) {
                    pendingCount++;
                    const node = document.createElement('div');
                    node.className =
                        "bg-lightcard dark:bg-darkcard p-3 rounded-xl border border-lightborder dark:border-slate-800 flex justify-between items-center text-xs";
                    node.innerHTML = `
                            <div class="flex items-center space-x-3">
                                <img src="${peer.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-8 h-8 rounded-full object-cover">
                                <div>
                                    <p class="font-bold text-slate-800 dark:text-slate-200">${peer.name}</p>
                                    <p class="text-[10px] text-slate-500 font-mono">@${peer.username || peer.uid}</p>
                                </div>
                            </div>
                            <div class="flex items-center space-x-2">
                                <button onclick="followUser('${peer.uid}')" class="bg-emerald-600/20 hover:bg-emerald-600 text-emerald-400 hover:text-white p-2 rounded-lg border border-emerald-500/30 transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"></path></svg>
                                </button>
                                <button onclick="unfollowUser('${peer.uid}')" class="bg-red-600/20 hover:bg-red-600 text-red-400 hover:text-white p-2 rounded-lg border border-red-500/30 transition">
                                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"></path></svg>
                                </button>
                            </div>
                        `;
                    requestsContainer.appendChild(node);
                }
            });

            const countBadge = document.getElementById('request-badge-count');
            if (pendingCount > 0) {
                countBadge.innerText = pendingCount;
                countBadge.classList.remove('hidden');
            } else {
                countBadge.classList.add('hidden');
                requestsContainer.innerHTML =
                    `<p class="text-[11px] text-slate-600 text-center py-2" data-lang="no-notifications">${translations[currentLanguage]?.['no-notifications'] || 'No pending follow requests.'}</p>`;
            }

            let chatList = [];
            databaseState.peers.forEach(peer => {
                if (peer.uid === myUID) return;
                const isMutual = databaseState.currentUser.following?.[peer.uid] && peer.followers?.[myUID];
                if (isMutual && !isUserBlocked(peer.uid)) {
                    const threadKey = myUID < peer.uid ? `${myUID}_text_${peer.uid}` : `${peer.uid}_text_${myUID}`;
                    const messages = databaseState.chatThreads[threadKey];
                    let unseenCount = 0;
                    let latestTimestamp = 0;
                    let lastMsg = '';
                    if (messages) {
                        Object.values(messages).forEach(m => {
                            if (m.sender !== myUID && m.status !== 'seen') { unseenCount++; }
                            if (m.timestamp > latestTimestamp) {
                                latestTimestamp = m.timestamp;
                                lastMsg = m.text;
                            }
                        });
                    }
                    chatList.push({
                        peer: peer,
                        unseenCount: unseenCount,
                        latestTimestamp: latestTimestamp,
                        threadKey: threadKey,
                        lastMsg: lastMsg
                    });
                }
            });

            chatList.sort((a, b) => b.latestTimestamp - a.latestTimestamp);

            if (chatList.length === 0) {
                container.innerHTML =
                    `<p class="text-[11px] text-slate-600 text-center py-4" data-lang="no-friends">${translations[currentLanguage]?.['no-friends'] || 'Follow users to start chatting.'}</p>`;
                return;
            }

            chatList.forEach(({ peer, unseenCount, threadKey, lastMsg }) => {
                const node = document.createElement('div');
                node.className =
                    `p-3 rounded-xl border flex justify-between items-center transition cursor-pointer ${unseenCount > 0 ? 'bg-blue-50 dark:bg-blue-950/30 border-blue-400 dark:border-blue-600/50 shadow-md shadow-blue-500/5' : 'bg-lightcard dark:bg-darkcard border-lightborder dark:border-slate-800 hover:bg-slate-100 dark:hover:bg-slate-800/80'}`;
                node.onclick = () => openDirectCommunicationChannel(peer.uid);

                node.innerHTML = `
                        <div class="flex items-center space-x-3 flex-1 min-w-0">
                            <img src="${peer.pfp || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150'}" class="w-9 h-9 rounded-full object-cover border border-slate-300 dark:border-slate-700 flex-shrink-0">
                            <div class="min-w-0 flex-1">
                                <p class="font-bold flex items-center gap-1.5 ${unseenCount > 0 ? 'text-blue-600 dark:text-blue-400 font-extrabold' : 'text-slate-800 dark:text-slate-200'}">
                                    <span class="truncate">${peer.name}</span>
                                    ${unseenCount > 0 ? '<span class="h-2 w-2 bg-blue-500 rounded-full animate-pulse flex-shrink-0"></span>' : ''}
                                </p>
                                <p class="text-[10px] text-slate-500 truncate">${lastMsg || (translations[currentLanguage]?.['no-messages'] || 'No messages yet')}</p>
                            </div>
                        </div>
                        ${unseenCount > 0 ? `<span class="bg-blue-600 text-white text-[10px] font-bold rounded-full h-5 px-2 flex items-center justify-center flex-shrink-0 ml-2">${unseenCount}</span>` : ''}
                    `;
                container.appendChild(node);
            });
        }

        window.openDirectCommunicationChannel = function(targetUID) {
            if (isUserBlocked(targetUID)) {
                showSuccessToast('Error', 'You have blocked this user.', '❌');
                return;
            }
            databaseState.activeTargetChatUID = targetUID;
            const peer = databaseState.peers.find(p => p.uid === targetUID);
            if (!peer) return;

            document.getElementById('chat-window-name').innerText = peer.name;
            document.getElementById('chat-window-username').innerText = '@' + (peer.username || peer.uid);
            document.getElementById('chat-window-avatar').src = peer.pfp ||
                'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?w=150';

            document.getElementById('chat-header-identity-trigger').onclick = () => {
                displayPeerAccountProfile(peer.uid);
            };

            const threadKey = databaseState.currentUser.uid < targetUID ?
                `${databaseState.currentUser.uid}_text_${targetUID}` :
                `${targetUID}_text_${databaseState.currentUser.uid}`;
            const messages = databaseState.chatThreads[threadKey];
            if (messages) {
                Object.keys(messages).forEach(mId => {
                    if (messages[mId].sender !== databaseState.currentUser.uid && messages[mId].status !==
                        'seen') {
                        update(ref(db, `chats/${threadKey}/${mId}`), { status: 'seen' });
                    }
                });
            }

            renderActiveChatLiveStream(targetUID);
            document.getElementById('chat-window-modal').classList.remove('hidden');
        };

        window.closeChatWindow = function() {
            databaseState.activeTargetChatUID = null;
            document.getElementById('chat-window-modal').classList.add('hidden');
        };

        function renderActiveChatLiveStream(targetUID) {
            const stream = document.getElementById('chat-messages-stream');
            stream.innerHTML = '';
            const myUID = databaseState.currentUser.uid;
            const threadKey = myUID < targetUID ? `${myUID}_text_${targetUID}` : `${targetUID}_text_${myUID}`;
            const packets = databaseState.chatThreads[threadKey];
            if (!packets) {
                stream.innerHTML =
                    `<div class="text-center text-slate-600 text-[10px] my-auto" data-lang="no-messages">${translations[currentLanguage]?.['no-messages'] || 'Channel structural pipeline is empty. Post first packet payload.'}</div>`;
                return;
            }

            Object.keys(packets).forEach(packetID => {
                const message = packets[packetID];
                const isMe = message.sender === myUID;
                const msgNode = document.createElement('div');
                msgNode.className =
                    `max-w-[75%] p-3 rounded-2xl text-xs relative group ${isMe ? 'bg-blue-600 text-white self-end rounded-tr-none' : 'bg-slate-200 dark:bg-darkcard text-slate-800 dark:text-slate-200 self-start rounded-tl-none border border-slate-300 dark:border-slate-800'}`;

                msgNode.oncontextmenu = (e) => {
                    e.preventDefault();
                    databaseState.activeContextMessageID = { thread: threadKey, id: packetID, txt: message.text };
                    document.getElementById('message-context-panel').classList.remove('hidden');
                };

                let reactionsMarkup = '';
                if (message.reactions) {
                    reactionsMarkup =
                        `<div class="absolute -bottom-2 right-2 bg-slate-200 dark:bg-slate-800 border border-slate-300 dark:border-slate-700 rounded-full px-1.5 py-0.5 text-[9px] flex items-center gap-0.5 shadow-lg">`;
                    Object.values(message.reactions).forEach(r => { reactionsMarkup += `<span>${r}</span>`; });
                    reactionsMarkup += `</div>`;
                }

                let mediaHtml = '';
                if (message.mediaType === 'reel' && message.mediaUrl) {
                    mediaHtml = `
                            <div class="mt-2 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-700 shared-media-preview" onclick="openFullScreenMedia('${message.mediaUrl}','video')">
                                <video src="${message.mediaUrl}" muted playsinline style="max-height:120px;width:100%;object-fit:cover;"></video>
                                <div class="media-label">Reel</div>
                            </div>
                        `;
                } else if (message.mediaType === 'post' && message.mediaUrl) {
                    mediaHtml = `
                            <div class="mt-2 rounded-lg overflow-hidden border border-slate-300 dark:border-slate-700 shared-media-preview" onclick="openFullScreenMedia('${message.mediaUrl}','image')">
                                <img src="${message.mediaUrl}" style="max-height:120px;width:100%;object-fit:cover;">
                            </div>
                        `;
                }

                msgNode.innerHTML = `
                        <p class="leading-relaxed break-words pr-2">${message.text}</p>
                        ${mediaHtml}
                        <span class="text-[8px] block text-right mt-1 ${isMe ? 'text-blue-200' : 'text-slate-500'} font-mono">${new Date(message.timestamp).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</span>
                        ${reactionsMarkup}
                    `;
                stream.appendChild(msgNode);
            });
            setTimeout(() => { stream.scrollTop = stream.scrollHeight; }, 50);
        }

        window.dispatchDirectMessage = function() {
            const field = document.getElementById('chat-input-field');
            const packetText = field.value.trim();
            if (!packetText || !databaseState.activeTargetChatUID) return;

            if (isUserBlocked(databaseState.activeTargetChatUID)) {
                showSuccessToast('Error', 'You have blocked this user.', '❌');
                return;
            }

            const myUID = databaseState.currentUser.uid;
            const targetUID = databaseState.activeTargetChatUID;
            const threadKey = myUID < targetUID ? `${myUID}_text_${targetUID}` : `${targetUID}_text_${myUID}`;
            const messagePayload = {
                sender: myUID,
                text: packetText,
                timestamp: Date.now(),
                status: 'transmitted'
            };

            push(ref(db, `chats/${threadKey}`), messagePayload).then(() => {
                field.value = '';
                renderActiveChatLiveStream(targetUID);
            });
        };

        window.injectContextReaction = function(emoji) {
            if (!databaseState.activeContextMessageID) return;
            const { thread, id } = databaseState.activeContextMessageID;
            push(ref(db, `chats/${thread}/${id}/reactions`), emoji).then(() => {
                document.getElementById('message-context-panel').classList.add('hidden');
            });
        };

        window.executeClipboardCopy = function() {
            if (!databaseState.activeContextMessageID) return;
            copyToClipboard(databaseState.activeContextMessageID.txt);
            document.getElementById('message-context-panel').classList.add('hidden');
        };

        // ============================================================
        // NOTIFICATION FUNCTIONS
        // ============================================================
        function addNotification(notification) {
            const targetUID = notification.targetUserId;
            if (!targetUID) return;

            const notif = {
                id: 'notif_' + Date.now() + '_' + Math.floor(Math.random() * 1000),
                ...notification,
                timestamp: Date.now(),
                read: false
            };

            if (targetUID === databaseState.currentUser.uid) {
                databaseState.notifications.unshift(notif);
            }

            const notifRef = ref(db, `users/${targetUID}/notifications`);
            get(notifRef).then((snap) => {
                const existing = snap.val() || [];
                const updated = [notif, ...existing].slice(0, 50);
                const sevenDaysAgo = Date.now() - (7 * 24 * 60 * 60 * 1000);
                const filtered = updated.filter(n => n.timestamp > sevenDaysAgo);
                set(notifRef, filtered);
            }).catch(err => console.warn('Failed to save notification:', err));

            saveStateToHardware();
            if (targetUID === databaseState.currentUser.uid) {
                renderNotifications();
                updateNotificationBadge();
            }
            return notif;
        }

            const container = document.getElementById('notification-list');
            container.innerHTML = '';

            if (databaseState.notifications.length === 0) {
                container.innerHTML = `
                        <div class="text-center text-slate-500 text-xs py-6">
                            <svg class="w-8 h-8 mx-auto mb-2 opacity-30" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                            ${translations[currentLanguage]?.['no-notifications'] || 'No notifications yet'}
                        </div>
                    `;
                return;
            }

            databaseState.notifications.forEach(notif => {
                const el = document.createElement('div');
                el.className =
                    `notification-item p-3 rounded-xl border flex items-start gap-2 ${notif.read ? 'bg-lightbg dark:bg-darkbg border-slate-300 dark:border-slate-800/50' : 'bg-slate-100 dark:bg-slate-800/50 border-cyan-500/30'}`;

                let icon = '📬';
                let color = 'text-blue-400';
                if (notif.type === 'like') { icon = '❤️';

                    color = 'text-cyan-400'; } else if (notif.type === 'follow') { icon = '➕';
                    color = 'text-emerald-400'; } else if (notif.type === 'reel_like') { icon = '🎬';
                    color = 'text-pink-400'; } else if (notif.type === 'reel_comment') { icon = '🎥';
                    color = 'text-purple-400'; } else if (notif.type === 'collab_request') { icon = '🤝';
                    color = 'text-amber-400'; } else if (notif.type === 'collab_accepted') { icon = '✅';

                        <span class="text-lg">${icon}</span>
                        <div class="flex-1">

                    `;
                container.appendChild(el);
            });

        function updateNotificationBadge() {
            const badge = document.getElementById('notification-count-badge');
            const unread = databaseState.notifications.filter(n => !n.read).length;
            if (unread > 0) {
                badge.textContent = unread;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        window.toggleNotificationDropdown = function() {
            const dropdown = document.getElementById('notification-dropdown');
            const isHidden = dropdown.classList.contains('hidden');

            if (isHidden) {
                dropdown.classList.remove('hidden');
                databaseState.notifications.forEach(n => n.read = true);
                const myUID = databaseState.currentUser.uid;
                if (myUID) {
                    set(ref(db, `users/${myUID}/notifications`), databaseState.notifications);
                }
                saveStateToHardware();
                renderNotifications();
                updateNotificationBadge();
            } else {
                dropdown.classList.add('hidden');
            }
        };

        window.markAllNotificationsRead = function() {
            databaseState.notifications.forEach(n => n.read = true);
            const myUID = databaseState.currentUser.uid;
            if (myUID) {
                set(ref(db, `users/${myUID}/notifications`), databaseState.notifications);
            }
            saveStateToHardware();
            renderNotifications();
            updateNotificationBadge();
        };

        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('notification-dropdown');
            const btn = e.target.closest('[onclick*="toggleNotificationDropdown"]') ||
                e.target.closest('#notification-dropdown');
            if (!btn && dropdown && !dropdown.classList.contains('hidden')) {
                dropdown.classList.add('hidden');
            }
        });

        // ============================================================
        // SEARCH FUNCTIONS
        // ============================================================
        window.handleUnifiedSearch = function() {
            const query = document.getElementById('search-input').value.trim().toLowerCase();
            const profileGrid = document.getElementById('search-results-profiles');
            const articleGrid = document.getElementById('search-results-articles');
            const hashtagGrid = document.getElementById('search-results-hashtags');
            profileGrid.innerHTML = '';
            articleGrid.innerHTML = '';
            hashtagGrid.innerHTML = '';
            if (!query) return;

            const myUID = databaseState.currentUser.uid;

            databaseState.peers.forEach(peer => {
                if (peer.uid === myUID) return;
                if (peer.username?.toLowerCase().includes(query) || peer.name?.toLowerCase().includes(query) ||
                    peer.uid.includes(query)) {
                    const isFollowing = databaseState.currentUser.following?.[peer.uid] === true;
                    const isFollower = databaseState.currentUser.followers?.[peer.uid] === true;
                    const isMutual = isFollowing && isFollower;

                    let buttonMarkup = '';
                    if (isMutual) {
                        buttonMarkup =
                            `<span class="text-[10px] bg-emerald-600/20 text-emerald-400 font-bold px-3 py-1.5 rounded-xl border border-emerald-500/30">${translations[currentLanguage]?.['following'] || 'Following'}</span>`;
                    } else if (isFollowing) {
                        buttonMarkup =
                            `<button onclick="unfollowUser('${peer.uid}')" class="bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 text-[10px] font-bold px-3 py-1.5 rounded-xl hover:bg-slate-300 dark:hover:bg-slate-700 transition">${translations[currentLanguage]?.['unfollow'] || 'Unfollow'}</button>`;
                    } else if (isFollower) {
                        buttonMarkup =

            const hashtagResults = [];
            databaseState.publications.forEach(post => {
                if (post.hashtags) {
                    post.hashtags.forEach(h => {
                        if (h.toLowerCase().includes(query)) {
                            hashtagResults.push({ postId: post.id, hashtag: h, post: post });
                        }
                    });
                }
            });
            databaseState.reels.forEach(reel => {
                if (reel.hashtags) {
                    reel.hashtags.forEach(h => {
                        if (h.toLowerCase().includes(query)) {
                            hashtagResults.push({ reelId: reel.id, hashtag: h, reel: reel });
                        }
                    });
                }
            });

            if (hashtagResults.length > 0) {
                const unique = [];
                const seen = new Set();
                hashtagResults.forEach(item => {
                    const key = item.hashtag + (item.postId || item.reelId);
                    if (!seen.has(key)) {
                        seen.add(key);
                        unique.push(item);
                    }
                });
                unique.slice(0, 10).forEach(item => {
                    const card = document.createElement('div');

                        "bg-lightcard dark:bg-darkcard p-3 rounded-xl border border-lightborder dark:border-slate-800 text-xs cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-800 transition";

                                }
                            }, 300);
                        };
                        card.innerHTML = `
                                <span class="text-cyan-400 font-bold">#${item.hashtag}</span>
                                <p class="text-slate-600 dark:text-slate-400 text-[10px] mt-1">Reel: ${item.reel?.caption || 'No caption'}</p>
                            `;
                    }
                    hashtagGrid.appendChild(card);
                });

                hashtagGrid.innerHTML =
                    `<p class="text-[10px] text-slate-600 text-center py-2">No hashtags found matching "${query}"</p>`;
            }
        };

        window.goToUserProfile = function(userId) {
            if (userId === databaseState.currentUser.uid) {
                switchTab('profile');
                return;
            }
            const peer = databaseState.peers.find(p => p.uid === userId);
            if (peer) {
                displayPeerAccountProfile(userId);
            } else {
                onValue(ref(db, 'users/' + userId), (snap) => {
                    const userData = snap.val();
                    if (userData) {
                        if (!databaseState.peers.find(p => p.uid === userId)) {
                            databaseState.peers.push(userData);
                        }
                        displayPeerAccountProfile(userId);
                    } else {
                        showSuccessToast('Error', 'User not found.', '❌');
                    }
                }, { onlyOnce: true });
            }
        };

            container.innerHTML = '';
            const myUID = databaseState.currentUser.uid;
            let count = 0;

            databaseState.peers.forEach(peer => {
                if (peer.uid === myUID) return;
                const isMutual = databaseState.currentUser.following?.[peer.uid] && peer.followers?.[myUID];
                if (isMutual && !isUserBlocked(peer.uid)) {

        window.executeShareTransmissionPacket = function(targetUID) {
            if (!databaseState.activeTargetSharePostID) return;
            const targetPost = databaseState.publications.find(p => p.id === databaseState.activeTargetSharePostID);
            if (!targetPost) return;

            const myUID = databaseState.currentUser.uid;
            const threadKey = myUID < targetUID ? `${myUID}_text_${targetUID}` : `${targetUID}_text_${myUID}`;
            const messagePayload = {
                sender: myUID,
                text: `📝 Shared a post: "${targetPost.text}"`,
                timestamp: Date.now(),
                status: 'transmitted',
                mediaType: 'post',
                mediaUrl: targetPost.image || null,
                postId: targetPost.id
            };

        function initializePeerConnection(uid) {
            peerInstance = new Peer('stardust-' + uid);
            peerInstance.on('call', (incomingCall) => {
                ongoingCallObject = incomingCall;
                const senderUID = incomingCall.peer.replace('stardust-', '');
                // Play ring sound
                playRingSound();
                onValue(ref(db, 'users/' + senderUID), (snap) => {
                    const userData = snap.val();
                    document.getElementById('call-peer-name').innerText = userData ? userData.name : 'Unknown Node';
                    document.getElementById('call-peer-username').innerText = '@' + (userData?.username ||
                    senderUID);
