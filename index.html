                    if (userData && userData.pfp) {
                        document.getElementById('call-peer-pfp').src = userData.pfp;
                    }
                    document.getElementById('incoming-call-actions').classList.remove('hidden');
                    document.getElementById('call-bottom-nav').classList.add('hidden');
                    document.getElementById('call-interface-overlay').classList.remove('hidden');
                    callState.peerId = senderUID;
                }, { onlyOnce: true });
            });
        }

        function playRingSound() {
            try {
                const audioCtx = new(window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.frequency.value = 440;
                oscillator.type = 'sine';
                gainNode.gain.value = 0.3;
                oscillator.start();
                setTimeout(() => {
                    oscillator.frequency.value = 600;
                }, 300);
                setTimeout(() => {
                    gainNode.gain.value = 0;
                    oscillator.stop();
                }, 800);
            } catch (e) {
                console.log('Ring sound not available');
            }
        }

        async function requestMicrophone() {
            try {
                return await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
            } catch (err) {
                console.error('Microphone error:', err);
                let errorMsg = 'Microphone access denied. Please allow microphone permissions.';
                if (err.name === 'NotAllowedError' || err.name === 'PermissionDeniedError') {
                    errorMsg = '🔴 Microphone permission denied. Please allow microphone access in your browser settings.';
                } else if (err.name === 'NotFoundError' || err.name === 'DevicesNotFoundError') {
                    errorMsg = '🔴 No microphone found. Please connect a microphone.';
                } else if (err.name === 'NotReadableError') {
                    errorMsg = '🔴 Microphone is in use by another application.';
                }
                showSuccessToast('Microphone Error', errorMsg, '❌');
                return null;
            }
        }

        window.initializeVoiceCallBroadcast = function() {
            if (!databaseState.activeTargetChatUID) {
                showSuccessToast('Info', 'Please select a contact to call.', 'ℹ️');
                return;
            }

            if (isUserBlocked(databaseState.activeTargetChatUID)) {
                showSuccessToast('Error', 'You have blocked this user.', '❌');
                return;
            }

            const targetUID = databaseState.activeTargetChatUID;
            const targetPeerID = 'stardust-' + targetUID;

            document.getElementById('call-status-lbl').innerText = 'Requesting Audio Stream...';
            document.getElementById('incoming-call-actions').classList.add('hidden');
            document.getElementById('call-bottom-nav').classList.remove('hidden');
            document.getElementById('call-interface-overlay').classList.remove('hidden');

            callState.isActive = true;
            callState.peerId = targetUID;

            onValue(ref(db, 'users/' + targetUID), (snap) => {
                const userData = snap.val();
                document.getElementById('call-peer-name').innerText = userData ? userData.name : 'Remote Node';
                document.getElementById('call-peer-username').innerText = '@' + (userData?.username || targetUID);
                if (userData && userData.pfp) {
                    document.getElementById('call-peer-pfp').src = userData.pfp;
                }
            }, { onlyOnce: true });

            requestMicrophone().then((stream) => {
                if (!stream) {
                    document.getElementById('call-interface-overlay').classList.add('hidden');
                    document.getElementById('call-status-lbl').innerText = 'Call Failed';
                    return;
                }

                nativeMediaStream = stream;
                callState.stream = stream;
                ongoingCallObject = peerInstance.call(targetPeerID, stream);
                callState.callObj = ongoingCallObject;

                ongoingCallObject.on('stream', (remoteStream) => {
                    document.getElementById('call-status-lbl').innerText = 'Encrypted Audio Active 🟢';
                    startCallDurationTimer();
                    showSuccessToast('Connected', 'Audio call established successfully.', '📞');
                });

                ongoingCallObject.on('error', (err) => {
                    console.error('Call error:', err);
                    showSuccessToast('Call Error', 'Connection lost. Please try again.', '❌');
                    terminateCallSession();
                });
            });
        };

        window.acceptIncomingCallSignal = function() {
            requestMicrophone().then((stream) => {
                if (!stream) {
                    document.getElementById('call-interface-overlay').classList.add('hidden');
                    rejectIncomingCallSignal();
                    return;
                }

                nativeMediaStream = stream;
                callState.stream = stream;
                callState.isActive = true;
                document.getElementById('incoming-call-actions').classList.add('hidden');
                document.getElementById('call-bottom-nav').classList.remove('hidden');
                document.getElementById('call-status-lbl').innerText = 'Connecting...';

                ongoingCallObject.answer(stream);
                callState.callObj = ongoingCallObject;
                ongoingCallObject.on('stream', (remoteStream) => {
                    document.getElementById('call-status-lbl').innerText = 'Encrypted Audio Active 🟢';
                    startCallDurationTimer();
                });
                showSuccessToast('Connected', 'Audio call accepted.', '📞');
            });
        };

        window.rejectIncomingCallSignal = function() {
            if (ongoingCallObject) ongoingCallObject.close();
            terminateCallSession();
        };

        window.terminateCallSession = function() {
            if (ongoingCallObject) { ongoingCallObject.close();
                ongoingCallObject = null; }
            if (nativeMediaStream) { nativeMediaStream.getTracks().forEach(track => track.stop());
                nativeMediaStream = null; }
            callState.stream = null;
            callState.callObj = null;
            if (callState.durationInterval) { clearInterval(callState.durationInterval);
                callState.durationInterval = null; }
            document.getElementById('call-interface-overlay').classList.add('hidden');
            document.getElementById('floating-call-window').classList.add('hidden');
            callState.isActive = false;
            callState.isFloating = false;
            callState.seconds = 0;
            callState.peerId = null;
            document.getElementById('floating-call-duration').innerText = '00:00';
            showSuccessToast('Call Ended', 'The call has been terminated.', '📴');
        };

        function startCallDurationTimer() {
            callState.seconds = 0;
            if (callState.durationInterval) clearInterval(callState.durationInterval);
            callState.durationInterval = setInterval(() => {

                const secs = String(callState.seconds % 60).padStart(2, '0');
                document.getElementById('floating-call-duration').innerText = `${mins}:${secs}`;
            }, 1000);
        }

        function setupFloatingDrag() {
            const el = document.getElementById('floating-call-window');
            el.removeEventListener('mousedown', startDrag);
            el.removeEventListener('touchstart', startDragTouch);
            el.addEventListener('mousedown', startDrag);
            el.addEventListener('touchstart', startDragTouch, { passive: false });
            document.removeEventListener('mousemove', moveDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchmove', moveDragTouch);
            document.removeEventListener('touchend', endDragTouch);
            document.addEventListener('mousemove', moveDrag);
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchmove', moveDragTouch, { passive: false });
            document.addEventListener('touchend', endDragTouch);
        }

        function startDrag(e) {
            if (e.target.closest('.floating-minimize-btn')) return;
            const el = document.getElementById('floating-call-window');
            dragData.isDragging = true;
            const rect = el.getBoundingClientRect();
            dragData.offsetX = e.clientX - rect.left;
            dragData.offsetY = e.clientY - rect.top;
            el.style.cursor = 'grabbing';
        }

        function startDragTouch(e) {
            if (e.target.closest('.floating-minimize-btn')) return;
            const touch = e.touches[0];
            const el = document.getElementById('floating-call-window');
            dragData.isDragging = true;
            const rect = el.getBoundingClientRect();
            dragData.offsetX = touch.clientX - rect.left;
            dragData.offsetY = touch.clientY - rect.top;
        }

        function moveDrag(e) {
            if (!dragData.isDragging) return;
            const el = document.getElementById('floating-call-window');
            let x = e.clientX - dragData.offsetX;
            let y = e.clientY - dragData.offsetY;
            constrainPosition(el, x, y);
        }

        function moveDragTouch(e) {
            if (!dragData.isDragging) return;
            e.preventDefault();
            const touch = e.touches[0];
            const el = document.getElementById('floating-call-window');
            let x = touch.clientX - dragData.offsetX;
            let y = touch.clientY - dragData.offsetY;
            constrainPosition(el, x, y);
        }

        function constrainPosition(el, x, y) {
            const winW = window.innerWidth;
            const winH = window.innerHeight;
            const w = 180;
            const h = 240;
            const snapX = x < winW / 2 ? 16 : winW - w - 16;
            const snapY = y < winH / 2 ? 80 : winH - h - 16;
            el.style.left = snapX + 'px';
            el.style.top = snapY + 'px';
            el.style.right = 'auto';
            el.style.bottom = 'auto';
        }

        function endDrag() {
            dragData.isDragging = false;
            const el = document.getElementById('floating-call-window');
            if (el) el.style.cursor = 'grab';
        }

        function endDragTouch() {
            dragData.isDragging = false;
        }

                if (profileContent) profileContent.classList.add('premium-profile-glow', glowColor);

        window.handleSubscriptionActivation = function() {
            const now = Date.now();
            const myUID = databaseState.currentUser.uid;

            // Check if already premium and within 30 days
            if (databaseState.currentUser.isPremium && databaseState.currentUser.premiumLastActivated) {
                const daysSince = (now - databaseState.currentUser.premiumLastActivated) / (24 * 60 * 60 * 1000);
                if (daysSince < 30) {
                    const daysLeft = Math.ceil(30 - daysSince);
                    showSuccessToast('Info',
                        `You already have premium active for ${daysLeft} more days. You can activate again after ${daysLeft} days.`,
                        'ℹ️');
                    return;
                }
            }

            const expiry = now + (30 * 24 * 60 * 60 * 1000);

            update(ref(db, 'users/' + myUID), {
                isPremium: true,
                premiumExpiry: expiry,
                premiumLastActivated: now
            }).then(() => {
                databaseState.currentUser.isPremium = true;
                databaseState.currentUser.premiumExpiry = expiry;
                databaseState.currentUser.premiumLastActivated = now;
                closeModal('subscription-modal');
                openModal('premium-dashboard-modal');
                applyPremiumSettings(databaseState.currentUser);
                saveStateToHardware();
                showSuccessToast('✅ Premium Activated!',
                    'You now have access to all premium features for 30 days!', '🌟');
            }).catch((err) => {
                console.error('Subscription activation failed:', err);
                showSuccessToast('✅ Premium Activated!', 'You now have access to all premium features!', '🌟');
                update(ref(db, 'users/' + myUID), { isPremium: true, premiumExpiry: expiry,
                    premiumLastActivated: now }).catch(() => {});
            });
        };

            const myUID = databaseState.currentUser.uid;

            const blockedIds = Object.keys(blocked);

            if (!container) container = document.getElementById('setting-detail-body');

            if (blockedIds.length === 0) {
                container.innerHTML =
                    `<p class="text-center text-slate-600 text-xs py-4">${translations[currentLanguage]?.['no-notifications'] || 'You haven\'t blocked any users.'}</p>`;

        // ============================================================

        window.saveProfileEdit = function() {
            const name = document.getElementById('edit-name').value.trim();
            const bio = document.getElementById('edit-bio').value.trim();
            const pfpFile = document.getElementById('edit-pfp').files[0];

            if (!name) { showSuccessToast('Error', 'Name cannot be empty.', '❌'); return; }

            const commitUpdate = (pfpBase64) => {
                const updates = { name: name, bio: bio };
                if (pfpBase64) updates.pfp = pfpBase64;
                update(ref(db, 'users/' + databaseState.currentUser.uid), updates).then(() => {
                    databaseState.currentUser.name = name;
                    databaseState.currentUser.bio = bio;
                    if (pfpBase64) databaseState.currentUser.pfp = pfpBase64;
                    saveStateToHardware();
                    renderProfile();
                    showSuccessToast('Profile Updated!', 'Your profile has been updated.', '✅');
                    closeModal('setting-detail-modal');
                    openModal('settings-hub-modal');
                }).catch((err) => { showSuccessToast('Error', err.message, '❌'); });
            };

            if (pfpFile) {
                const reader = new FileReader();
                reader.onload = (e) => commitUpdate(e.target.result);
                reader.readAsDataURL(pfpFile);
            } else {
                commitUpdate(null);
            }
        };

        window.openEditUsername = function() {
            const newUsername = prompt('Enter new username:', databaseState.currentUser.username || '');
            if (newUsername && newUsername.trim()) {
                const username = newUsername.trim();
                onValue(ref(db, 'users'), (snap) => {
                    const data = snap.val();
                    if (data) {
                        const existing = Object.values(data).find(p => p.username === username && p.uid !== databaseState
                            .currentUser.uid);
                        if (existing) {
                            showSuccessToast('Error', 'Username already taken.', '❌');
                            return;
                        }
                    }
                    update(ref(db, 'users/' + databaseState.currentUser.uid), { username: username }).then(() => {
                        databaseState.currentUser.username = username;
                        saveStateToHardware();
                        renderProfile();
                        showSuccessToast('Username Updated!', `Username changed to @${username}`, '✅');
                        closeModal('setting-detail-modal');
                        openModal('settings-hub-modal');
                    });
                }, { onlyOnce: true });
            }

            update(ref(db, 'users/' + databaseState.currentUser.uid), { isPrivate: newVal }).then(() => {
                databaseState.currentUser.isPrivate = newVal;

        window.changePassword = function() {
            const oldPass = document.getElementById('old-password')?.value.trim();
            const newPass = document.getElementById('new-password')?.value.trim();
            const confirmPass = document.getElementById('confirm-password')?.value.trim();

            if (!oldPass || !newPass || !confirmPass) {
                showSuccessToast('Error', 'Please fill all fields.', '❌');
                return;
            }
            if (newPass !== confirmPass) {
                showSuccessToast('Error', 'Passwords do not match.', '❌');
                return;
            }
            if (newPass.length < 6) {
                showSuccessToast('Error', 'Password must be at least 6 characters.', '❌');
                return;
            }

            const user = auth.currentUser;
            if (!user) { showSuccessToast('Error', 'Please login again.', '❌'); return; }

            import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js").then(({ EmailAuthProvider,
                reauthenticateWithCredential }) => {
                const credential = EmailAuthProvider.credential(user.email, oldPass);
                reauthenticateWithCredential(user, credential)
                    .then(() => updatePassword(user, newPass))
                    .then(() => {
                        showSuccessToast('Success!', 'Password changed successfully.', '✅');
                        closeModal('setting-detail-modal');
                        openModal('settings-hub-modal');
                    })
                    .catch((error) => { showSuccessToast('Error', error.message, '❌'); });
            });
        };

        window.deleteAccount = function() {
            const password = document.getElementById('delete-account-password')?.value.trim();
            if (!password) { showSuccessToast('Error', 'Please enter your password.', '❌'); return; }

            if (!confirm(translations[currentLanguage]?.['confirm-delete'] ||
                    '⚠️ Are you sure you want to permanently delete your account? This cannot be undone!')) return;

            const user = auth.currentUser;
            if (!user) { showSuccessToast('Error', 'Please login again.', '❌'); return; }

            import("https://www.gstatic.com/firebasejs/9.23.0/firebase-auth.js").then(({ EmailAuthProvider,
                reauthenticateWithCredential }) => {
                const credential = EmailAuthProvider.credential(user.email, password);
                reauthenticateWithCredential(user, credential)
                    .then(() => {
                        const uid = databaseState.currentUser.uid;
                        remove(ref(db, 'users/' + uid)).then(() => {
                            const pubRef = ref(db, 'publications');
                            get(pubRef).then((snap) => {
                                const data = snap.val();
                                if (data) {
                                    Object.keys(data).forEach(k => {
                                        if (data[k] && data[k].authorUID === uid) {
                                            remove(ref(db, `publications/${k}`));
                                        }
                                    });
                                }
                            });
                            const reelRef = ref(db, 'reels');
                            get(reelRef).then((snap) => {
                                const data = snap.val();
                                if (data) {
                                    Object.keys(data).forEach(k => {
                                        if (data[k] && data[k].userId === uid) {
                                            remove(ref(db, `reels/${k}`));
                                        }
                                    });
                                }
                            });
                            user.delete().then(() => {
                                localStorage.removeItem("STARDUST_CORE_DB_PROD");
                                showSuccessToast('Account Deleted', 'Your account has been permanently deleted.',
                                    '🗑️');
                                setTimeout(() => location.reload(), 1500);
                            });
                        });
                    })
                    .catch((error) => { showSuccessToast('Error', error.message, '❌'); });
            });
        };

        // ============================================================
        // GROUP CHAT
        // ============================================================
        window.openGroupCreationModal = function() {
            closeElement('chat-menu');
            const container = document.getElementById('group-friends-selection-grid');
            container.innerHTML = '';
            const myUID = databaseState.currentUser.uid;
            let count = 0;

            databaseState.peers.forEach(peer => {
                if (peer.uid === myUID) return;
                const isMutual = databaseState.currentUser.following?.[peer.uid] && peer.followers?.[myUID];
                if (isMutual && !isUserBlocked(peer.uid)) {
                    count++;
                    const row = document.createElement('div');
                    row.className =
                        "flex items-center justify-between bg-lightbg dark:bg-darkbg p-2.5 rounded-xl border border-lightborder dark:border-slate-800";
                    row.innerHTML = `
                            <span class="text-slate-700 dark:text-slate-300 font-medium">${peer.name} (@${peer.username || peer.uid})</span>
                            <input type="checkbox" value="${peer.uid}" class="group-checkbox-node h-4 w-4 accent-cyan-500">
                        `;
                    container.appendChild(row);
                }
            });

            if (count === 0) {
                container.innerHTML =
                    `<p class="text-[10px] text-slate-600 italic text-center py-2">No network friends linked to build a group canvas.</p>`;
            }
            openModal('group-chat-modal');
        };

        window.executeGroupChatEstablishment = function() {
            const title = document.getElementById('group-name-input').value.trim();
            if (!title) { alert("Please provide group identity title tag."); return; }
            const boxes = document.querySelectorAll('.group-checkbox-node:checked');
            const participants = [databaseState.currentUser.uid];
            boxes.forEach(b => participants.push(b.value));
            if (participants.length < 2) { alert("Please select participants to compile channel."); return; }
            showSuccessToast('Group Created!', 'Multiplex session initialized successfully.', '👥');
            document.getElementById('group-name-input').value = '';
            closeModal('group-chat-modal');
        };

        // ============================================================
        // COLLABORATION END
        // ============================================================
        window.endCollaboration = function(postId) {
            if (confirm('Are you sure you want to end collaboration on this post?')) {
                const pubRef = ref(db, 'publications');
                get(pubRef).then((snap) => {
                    const data = snap.val();
                    if (data) {
                        let dbKey = null;
                        Object.keys(data).forEach(k => { if (data[k] && data[k].id === postId) { dbKey = k; } });
                        if (dbKey) {
                            update(ref(db, `publications/${dbKey}`), { collaborators: [] }).then(() => {
                                showSuccessToast('Collaboration Ended', 'Collaborators removed from this post.',
                                    '✅');
                                loadInitialPosts();
                            });
                        }
                    }
                });
            }
        };

        // ============================================================
        // APP INITIALIZATION
        // ============================================================
        function initApp() {
            loadInitialPosts();
            loadReelsOnDemand();
            renderProfile();
            renderNotifications();
            updateNotificationBadge();
            renderChatList();
            applyLanguage();

            if (databaseState.currentUser.isPremium) {
                applyPremiumSettings(databaseState.currentUser);
            }

            initializePeerConnection(databaseState.currentUser.uid);

            const myUID = databaseState.currentUser.uid;

            onValue(ref(db, 'users'), (snap) => {
                const data = snap.val();
                databaseState.peers = data ? Object.values(data) : [];
                if (data && data[myUID]) {
                    databaseState.currentUser = data[myUID];
                    if (!databaseState.currentUser.savedPosts) databaseState.currentUser.savedPosts = [];
                    if (!databaseState.currentUser.savedReels) databaseState.currentUser.savedReels = [];
                    if (!databaseState.currentUser.notifications) databaseState.currentUser.notifications = [];
                    if (!databaseState.currentUser.followers) databaseState.currentUser.followers = {};
                    if (!databaseState.currentUser.following) databaseState.currentUser.following = {};
                    if (!databaseState.currentUser.blocked) databaseState.currentUser.blocked = {};
                    if (!databaseState.reelViewTracked) databaseState.reelViewTracked = {};
                    renderProfile();
                    if (databaseState.currentUser.isPremium) {
                        applyPremiumSettings(databaseState.currentUser);
                    }
                }
                renderChatList();
            });

            onValue(ref(db, 'friendships'), (snap) => {
                databaseState.friendships = snap.val() || {};
                renderChatList();
            });

            onValue(ref(db, 'chats'), (snap) => {
                databaseState.chatThreads = snap.val() || {};
                updateUnseenBadge();
                renderChatList();
                if (databaseState.activeTargetChatUID) {
                    renderActiveChatLiveStream(databaseState.activeTargetChatUID);
                }
            });

            // Check premium expiry
            if (databaseState.currentUser.isPremium && databaseState.currentUser.premiumExpiry) {
                const now = Date.now();
                if (now > databaseState.currentUser.premiumExpiry) {
                    update(ref(db, 'users/' + databaseState.currentUser.uid), {
                        isPremium: false,
                        premiumTheme: '',
                        premiumFrame: '',
                        premiumFont: ''
                    }).then(() => {
                        databaseState.currentUser.isPremium = false;
                        databaseState.currentUser.premiumTheme = '';
                        databaseState.currentUser.premiumFrame = '';
                        databaseState.currentUser.premiumFont = '';
                        applyPremiumSettings(databaseState.currentUser);
                        saveStateToHardware();
                    });
                }
            }
        }

        function updateUnseenBadge() {
            let totalUnseen = 0;
            const myUID = databaseState.currentUser.uid;
            Object.keys(databaseState.chatThreads).forEach(threadKey => {
                if (threadKey.includes(myUID)) {
                    const messages = databaseState.chatThreads[threadKey];
                    Object.values(messages).forEach(msg => {
                        if (msg.sender !== myUID && msg.status !== 'seen') {
                            totalUnseen++;
                        }
                    });
                }
            });
            const badge = document.getElementById('global-unseen-badge');
            if (totalUnseen > 0) {
                badge.innerText = totalUnseen;
                badge.classList.remove('hidden');
            } else {
                badge.classList.add('hidden');
            }
        }

        // ============================================================
        // AUTH STATE OBSERVER
        // ============================================================
        onAuthStateChanged(auth, (user) => {
            if (user) {
                onValue(ref(db, 'users'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const mappedNode = Object.values(data).find(p => p.realFirebaseUID === user.uid);
                        if (mappedNode) {
                            databaseState.currentUser = mappedNode;
                            if (!databaseState.currentUser.savedPosts) databaseState.currentUser.savedPosts = [];
                            if (!databaseState.currentUser.savedReels) databaseState.currentUser.savedReels = [];
                            if (!databaseState.currentUser.notifications) databaseState.currentUser
                                .notifications = [];
                            if (!databaseState.currentUser.followers) databaseState.currentUser.followers = {};
                            if (!databaseState.currentUser.following) databaseState.currentUser.following = {};
                            if (!databaseState.currentUser.blocked) databaseState.currentUser.blocked = {};

                            // HIDE LOADING SCREEN IMMEDIATELY
                            document.getElementById('loading-screen').classList.add('hidden');
                            document.getElementById('login-screen').classList.add('hidden');
                            document.getElementById('app-layout').classList.remove('hidden');

                            initApp();
                            saveStateToHardware();
                        }
                    }
                }, { onlyOnce: true });
            } else {
                document.getElementById('loading-screen').classList.add('hidden');
                document.getElementById('login-screen').classList.remove('hidden');
                document.getElementById('app-layout').classList.add('hidden');
            }
        });

        // ============================================================
        // STARTUP
        // ============================================================
        recoverStateFromHardware();

        // HIDE LOADING SCREEN AFTER 1 SECOND MAX (if auth state doesn't trigger it)
        setTimeout(() => {
            document.getElementById('loading-screen').classList.add('hidden');
        }, 1000);

        console.log('🚀 Stardust Hub - Complete Social Media Platform');
        console.log('✅ All features implemented successfully');
        console.log('📱 Follow/Unfollow system active');
        console.log('🔒 Block/Unblock system active');
        console.log('🎬 Reels with 3-dot menu, delete & edit');
        console.log('🤝 Collaboration with max 5 users');
        console.log('🏷️ Tag system');
        console.log('📋 Copy link for posts & reels');
        console.log('🌐 Multi-language support (17 languages)');
        console.log('✨ Premium themes, frames & fonts');
        console.log('🔐 Privacy policy & Terms of service (GitHub links)');
        console.log('📞 Call ring sound active');
        console.log('🎉 Your social media is COMPLETE!');
    </script>

    <!-- ===== SUCCESS TOAST ===== -->
    <div id="success-toast" class="success-toast hidden">
        <div class="flex items-center gap-3">
            <span class="text-2xl" id="toast-icon">✅</span>
            <div>
                <p id="toast-title" class="font-bold text-sm">Success!</p>
                <p id="toast-message" class="text-xs text-emerald-200">Your content has been uploaded successfully.</p>
            </div>
        </div>
    </div>

</body>
</html>
